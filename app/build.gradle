plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'io.github.zh_xijun.bluper'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'io.github.zh_xijun.bluper'
        minSdk = 29
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/*.version',
                    'META-INF/*.kotlin_module',
            ]
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    // 运行时由框架提供，不能打包进 APK
    compileOnly libs.libxposed.api
    implementation(libs.dexkit) {
        // libdexkit.so 没有依赖 libc++_shared.so，去掉多余的 native 运行时
        exclude group: 'dev.rikka.ndk.thirdparty', module: 'cxx'
    }
}
